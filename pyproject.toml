[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-guard"
version = "0.1.0"
# Keep in step with the GitHub About blurb and topics; see docs/repo-metadata.md.
description = "Webcam posture monitor that targets shoulder protraction, not forward head posture. Calibrated to you, runs entirely on-device."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Emiel van Lieshout" }]
keywords = [
    "posture",
    "posture-corrector",
    "ergonomics",
    "rsi",
    "mediapipe",
    "pose-estimation",
    "computer-vision",
    "webcam",
    "macos",
    "menubar-app",
    "privacy",
    "on-device",
]
classifiers = [
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# opencv arrives transitively via mediapipe (opencv-contrib-python). Declaring
# opencv-python here as well would install a second, conflicting cv2.
dependencies = [
    "mediapipe>=1.0.0",
    "numpy>=1.26",
    # Used only by `setup`, to verify the model download on Python builds that
    # do not use the system trust store (python.org, pyenv, conda).
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
macos = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    # Reads the camera authorisation status and raises the system prompt, so a
    # refused permission reports itself instead of surfacing as a backend error.
    "pyobjc-framework-AVFoundation>=10.0",
]
dev = ["pytest>=8"]

[project.scripts]
posture-guard = "posture_guard.cli:main"

[project.urls]
Homepage = "https://github.com/emielvanlieshout/posture-guard"
Issues = "https://github.com/emielvanlieshout/posture-guard/issues"

[tool.setuptools.packages.find]
include = ["posture_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
